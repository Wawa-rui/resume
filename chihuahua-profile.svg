<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 (시원하고 깔끔한 소프트 인디고/블루) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="50%" stop-color="#E5EDFF"/>
      <stop offset="100%" stop-color="#D8E2FD"/>
    </linearGradient>

    <!-- 블랙탄 기본 털 그라데이션 (매끄럽고 부드러운 블랙/차콜 코트) -->
    <linearGradient id="blackFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#353842"/>
      <stop offset="45%" stop-color="#24262E"/>
      <stop offset="100%" stop-color="#16171C"/>
    </linearGradient>

    <!-- 머리 상단 윤기 하이라이트 (단모 특유의 반짝이는 털결) -->
    <radialGradient id="headSheen" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5B6173" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#24262E" stop-opacity="0"/>
    </radialGradient>

    <!-- 탄(Tan) 포인트 그라데이션 (따뜻하고 진한 황금빛 캐러멜) -->
    <linearGradient id="tanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#C9752A"/>
    </linearGradient>

    <!-- 탄 하이라이트 (주둥이 하단/볼 중심) -->
    <linearGradient id="tanLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>

    <!-- 귀 안쪽 핑크/피치 그라데이션 -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8A0"/>
      <stop offset="100%" stop-color="#F08080"/>
    </linearGradient>

    <!-- 눈동자 홍채 그라데이션 (깊이 있는 초콜릿 브라운) -->
    <radialGradient id="eyeIris" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5A2E14"/>
      <stop offset="70%" stop-color="#261208"/>
      <stop offset="100%" stop-color="#110703"/>
    </radialGradient>

    <!-- 목걸이 스카프 그라데이션 -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312E81" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 원형 배경 -->
  <circle cx="120" cy="120" r="112" fill="url(#bgGrad)" stroke="#C7D2FE" stroke-width="4"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <g filter="url(#softShadow)">
    <!-- 귀 (왼쪽 귀 - 치와와 특유의 쫑긋하고 큰 박쥐귀) -->
    <g>
      <!-- 외측 귀 (블랙) -->
      <path d="M 85,115 C 60,95 24,55 42,28 C 58,8 88,48 102,95 Z" fill="url(#blackFur)" stroke="#16171C" stroke-width="1.5"/>
      <!-- 귀 가장자리 탄 포인트 음영 -->
      <path d="M 82,110 C 66,93 42,62 52,40 C 58,32 70,50 82,80 Z" fill="url(#tanGrad)" opacity="0.45"/>
      <!-- 내측 귀 (핑크빛 속살) -->
      <path d="M 80,105 C 66,88 44,60 54,42 C 64,28 82,58 92,92 Z" fill="url(#earPink)" opacity="0.95"/>
      <!-- 귀 주름 음영선 -->
      <path d="M 80,85 C 75,70 70,60 66,54" fill="none" stroke="#E06D6D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 귀 (오른쪽 귀 - 치와와 특유의 쫑긋하고 큰 박쥐귀) -->
    <g>
      <!-- 외측 귀 (블랙) -->
      <path d="M 155,115 C 180,95 216,55 198,28 C 182,8 152,48 138,95 Z" fill="url(#blackFur)" stroke="#16171C" stroke-width="1.5"/>
      <!-- 귀 가장자리 탄 포인트 음영 -->
      <path d="M 158,110 C 174,93 198,62 188,40 C 182,32 170,50 158,80 Z" fill="url(#tanGrad)" opacity="0.45"/>
      <!-- 내측 귀 (핑크빛 속살) -->
      <path d="M 160,105 C 174,88 196,60 186,42 C 176,28 158,58 148,92 Z" fill="url(#earPink)" opacity="0.95"/>
      <!-- 귀 주름 음영선 -->
      <path d="M 160,85 C 165,70 170,60 174,54" fill="none" stroke="#E06D6D" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 몸통 / 목 (블랙 코트) -->
    <path d="M 88,175 C 80,195 65,225 65,232 L 175,232 C 175,225 160,195 152,175 Z" fill="url(#blackFur)"/>

    <!-- 가슴 탄(Tan) 무늬 (블랙탄의 클래식한 가슴 갈색 포인트) -->
    <path d="M 82,185 C 75,200 68,220 70,232 L 98,232 C 104,215 106,198 100,186 Z" fill="url(#tanGrad)"/>
    <path d="M 158,185 C 165,200 172,220 170,232 L 142,232 C 136,215 134,198 140,186 Z" fill="url(#tanGrad)"/>

    <!-- 가슴 중앙 작은 화이트 다이아몬드 포인트 -->
    <path d="M 115,188 C 117,184 123,184 125,188 C 127,198 123,212 120,220 C 117,212 113,198 115,188 Z" fill="#FFFDF9" opacity="0.95"/>

    <!-- 옷 / 카라 (선명한 인디고 블루 스카프) -->
    <path d="M 84,178 C 104,192 136,192 156,178 C 160,188 150,196 120,202 C 90,196 80,188 84,178 Z" fill="url(#collarGrad)"/>
    <!-- 카라 골드 스티치 라인 -->
    <path d="M 88,180 C 106,192 134,192 152,180" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8"/>
    <!-- 골드 펜던트 메달 & 방울 -->
    <circle cx="120" cy="201" r="7.5" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="120" cy="201" r="4.5" fill="#FDE68A"/>
    <!-- 발바닥 모양 골드 음각 -->
    <ellipse cx="120" cy="202.2" rx="1.8" ry="1.3" fill="#B45309"/>
    <circle cx="118.2" cy="199.8" r="0.7" fill="#B45309"/>
    <circle cx="120" cy="199.2" r="0.7" fill="#B45309"/>
    <circle cx="121.8" cy="199.8" r="0.7" fill="#B45309"/>

    <!-- 머리 (치와와 특유의 동글동글한 사과형 두상 - 블랙) -->
    <ellipse cx="120" cy="125" rx="54" ry="48" fill="url(#blackFur)"/>

    <!-- 이마 양쪽 볼살 베이스 라인 -->
    <path d="M 72,135 C 68,148 76,160 90,165 C 102,170 138,170 150,165 C 164,160 172,148 168,135 C 174,115 168,90 120,88 C 72,90 66,115 72,135 Z" fill="url(#blackFur)"/>

    <!-- 머리 상단 윤기 하이라이트 -->
    <ellipse cx="120" cy="112" rx="42" ry="24" fill="url(#headSheen)"/>

    <!-- ★ 블랙탄 시그니처 1: 양 볼 탄(Tan) 무늬 ★ -->
    <!-- 왼쪽 볼 탄 무늬 -->
    <path d="M 72,136 C 68,148 76,160 90,165 C 100,167 106,158 106,146 C 106,136 94,130 82,130 C 76,130 73,133 72,136 Z" fill="url(#tanGrad)"/>
    <!-- 오른쪽 볼 탄 무늬 -->
    <path d="M 168,136 C 172,148 164,160 150,165 C 140,167 134,158 134,146 C 134,136 146,130 158,130 C 164,130 167,133 168,136 Z" fill="url(#tanGrad)"/>

    <!-- ★ 블랙탄 시그니처 2: 주둥이(머즐) 탄 영역 ★ -->
    <ellipse cx="120" cy="147" rx="25" ry="19" fill="url(#tanGrad)"/>
    <!-- 입 주변 밝은 크림-탄 하이라이트 -->
    <ellipse cx="120" cy="151" rx="17" ry="13" fill="url(#tanLight)"/>

    <!-- 턱 밑 작은 화이트 포인트 -->
    <ellipse cx="120" cy="162" rx="4" ry="2" fill="#FFFDF9" opacity="0.85"/>

    <!-- 화사한 생기를 주는 볼터치 -->
    <circle cx="82" cy="146" r="8.5" fill="#FB7185" opacity="0.25"/>
    <circle cx="158" cy="146" r="8.5" fill="#FB7185" opacity="0.25"/>

    <!-- 코 (작고 윤기나는 까만 조약돌 코) -->
    <path d="M 112,138 C 112,134 128,134 128,138 C 128,144 124,147 120,147 C 116,147 112,144 112,138 Z" fill="#121215"/>
    <!-- 코 하이라이트 -->
    <ellipse cx="117" cy="137.5" rx="2.5" ry="1.2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="123" cy="139" r="0.8" fill="#FFFFFF" opacity="0.6"/>

    <!-- 입 (인중선과 귀여운 미소) -->
    <path d="M 120,147 L 120,153" stroke="#2B1D16" stroke-width="2" stroke-linecap="round"/>
    <path d="M 113,153 Q 120,158 127,153" fill="none" stroke="#2B1D16" stroke-width="2" stroke-linecap="round"/>
    <!-- 살짝 내민 앙증맞은 핑크 혀 -->
    <path d="M 118,155 C 118,159 122,159 122,155 Z" fill="#FB7185"/>

    <!-- 수염 모공 점 (위스커 닷) -->
    <circle cx="107" cy="148" r="0.8" fill="#8B4513" opacity="0.35"/>
    <circle cx="104" cy="151" r="0.8" fill="#8B4513" opacity="0.35"/>
    <circle cx="107" cy="154" r="0.8" fill="#8B4513" opacity="0.35"/>
    <circle cx="133" cy="148" r="0.8" fill="#8B4513" opacity="0.35"/>
    <circle cx="136" cy="151" r="0.8" fill="#8B4513" opacity="0.35"/>
    <circle cx="133" cy="154" r="0.8" fill="#8B4513" opacity="0.35"/>

    <!-- ★ 블랙탄 시그니처 3: 눈썹 위 탄 포인트 ("마로마유" / 황금빛 탄 점) ★ -->
    <g>
      <!-- 왼쪽 눈썹 탄 -->
      <ellipse cx="94" cy="101" rx="5.5" ry="4" fill="url(#tanGrad)" transform="rotate(-15 94 101)"/>
      <ellipse cx="94" cy="100.5" rx="3.5" ry="2.2" fill="#FED7AA" opacity="0.8" transform="rotate(-15 94 101)"/>

      <!-- 오른쪽 눈썹 탄 -->
      <ellipse cx="146" cy="101" rx="5.5" ry="4" fill="url(#tanGrad)" transform="rotate(15 146 101)"/>
      <ellipse cx="146" cy="100.5" rx="3.5" ry="2.2" fill="#FED7AA" opacity="0.8" transform="rotate(15 146 101)"/>
    </g>

    <!-- ★ 치와와의 생명: 커다랗고 촉촉하게 빛나는 왕눈망울 ★ -->
    <!-- 왼쪽 눈 -->
    <g>
      <!-- 눈 둘레 음영 -->
      <ellipse cx="96" cy="123" rx="14.5" ry="16.5" fill="#0C0A09" opacity="0.95"/>
      <!-- 홍채 베이스 -->
      <ellipse cx="96" cy="123" rx="13" ry="15" fill="url(#eyeIris)"/>
      <!-- 하단 홍채 비침 (유리알 광택) -->
      <path d="M 87,126 C 89,134 103,134 105,126 C 103,131 90,131 87,126 Z" fill="#D97706" opacity="0.6"/>
      <!-- 커다란 주 하이라이트 -->
      <circle cx="92" cy="118" r="5.2" fill="#FFFFFF"/>
      <!-- 보조 반짝임들 -->
      <circle cx="101" cy="127" r="2.6" fill="#FFFFFF"/>
      <circle cx="94" cy="131" r="1.4" fill="#FFFFFF" opacity="0.85"/>
      <!-- 별빛 반짝임 효과 -->
      <circle cx="98" cy="116" r="1.1" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- 오른쪽 눈 -->
    <g>
      <!-- 눈 둘레 음영 -->
      <ellipse cx="144" cy="123" rx="14.5" ry="16.5" fill="#0C0A09" opacity="0.95"/>
      <!-- 홍채 베이스 -->
      <ellipse cx="144" cy="123" rx="13" ry="15" fill="url(#eyeIris)"/>
      <!-- 하단 홍채 비침 (유리알 광택) -->
      <path d="M 135,126 C 137,134 151,134 153,126 C 151,131 138,131 135,126 Z" fill="#D97706" opacity="0.6"/>
      <!-- 커다란 주 하이라이트 -->
      <circle cx="140" cy="118" r="5.2" fill="#FFFFFF"/>
      <!-- 보조 반짝임들 -->
      <circle cx="149" cy="127" r="2.6" fill="#FFFFFF"/>
      <circle cx="142" cy="131" r="1.4" fill="#FFFFFF" opacity="0.85"/>
      <!-- 별빛 반짝임 효과 -->
      <circle cx="146" cy="116" r="1.1" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- 머리 위 반짝이는 골드 스파클 효과 (성취/초롱초롱함) -->
    <path d="M 120,44 Q 122,50 128,52 Q 122,54 120,60 Q 118,54 112,52 Q 118,50 120,44 Z" fill="#FBBF24" opacity="0.9"/>
    <circle cx="134" cy="46" r="2" fill="#FBBF24" opacity="0.8"/>
    <circle cx="107" cy="48" r="1.5" fill="#FBBF24" opacity="0.7"/>
  </g>
</svg>
